name: visua-reactor

services:
  postgres:
    image: ${VISUA_POSTGRES_IMAGE:?Set an immutable PostgreSQL image digest}
    environment:
      POSTGRES_USER: visua_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/init.sql:/docker-entrypoint-initdb.d/10-visua.sql:ro
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U visua_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${VISUA_IMAGE:?Set an immutable Visua image ID or digest}
    env_file:
      - ./shared/app.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - evidence_data:/app/data
    networks:
      - database
      - outbound
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  database:
    internal: true
  outbound:

volumes:
  postgres_data:
  evidence_data:

secrets:
  postgres_admin_password:
    file: ./shared/postgres-admin-password
